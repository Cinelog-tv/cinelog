basePath: /api/v1
definitions:
  controllers.ErrorResponse:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  controllers.RoleResponse:
    enum:
    - admin
    - user
    type: string
    x-enum-varnames:
    - UserRoleAdmin
    - UserRoleUser
  controllers.UserPreferencesResponse:
    properties:
      default_view:
        type: string
      show_adult_content:
        type: boolean
      theme:
        type: string
      tmdb_language:
        type: string
      ui_language:
        type: string
    type: object
  controllers.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      preferences:
        $ref: '#/definitions/controllers.UserPreferencesResponse'
      role:
        $ref: '#/definitions/controllers.RoleResponse'
      username:
        type: string
    type: object
  dto.AnalyticsResponse:
    properties:
      most_watched_media:
        items:
          $ref: '#/definitions/dto.WatchedMediaResponse'
        type: array
      physical_by_format:
        additionalProperties:
          type: integer
        type: object
      total_episodes:
        type: integer
      total_movies:
        type: integer
      total_physical:
        type: integer
      total_tv_shows:
        type: integer
      total_watched:
        type: integer
    type: object
  dto.CastResponse:
    properties:
      character:
        type: string
      id:
        type: integer
      name:
        type: string
      order:
        type: integer
      profile_path:
        type: string
    type: object
  dto.DiscoverResponse:
    properties:
      page:
        type: integer
      results:
        items:
          $ref: '#/definitions/dto.MediaResponse'
        type: array
      total_pages:
        type: integer
      total_results:
        type: integer
    type: object
  dto.MediaResponse:
    properties:
      backdrop:
        type: string
      cast:
        items:
          $ref: '#/definitions/dto.CastResponse'
        type: array
      genre:
        $ref: '#/definitions/tmdb.GenreItem'
      genres:
        items:
          $ref: '#/definitions/tmdb.GenreItem'
        type: array
      id:
        type: integer
      number_of_episodes:
        type: integer
      number_of_seasons:
        type: integer
      overview:
        type: string
      poster:
        type: string
      rating:
        type: number
      release_date:
        type: string
      runtime:
        type: integer
      seasons:
        items:
          $ref: '#/definitions/dto.SeasonResponse'
        type: array
      title:
        type: string
      type:
        $ref: '#/definitions/dto.MediaType'
      year:
        type: integer
    type: object
  dto.MediaType:
    enum:
    - movie
    - tv
    - episode
    type: string
    x-enum-varnames:
    - Movie
    - TV
    - Episode
  dto.PhysicalMediaRequest:
    properties:
      edition:
        type: string
      format:
        type: string
      mark_as_watched:
        description: 'Optionnel: marquer comme vu lors de l''ajout'
        type: boolean
      media_type:
        description: '"movie", "tv"'
        type: string
      price:
        type: number
      season_number:
        type: integer
      store:
        type: string
      tmdb_id:
        type: integer
    type: object
  dto.PhysicalMediaResponse:
    properties:
      created_at:
        type: string
      edition:
        type: string
      format:
        type: string
      id:
        type: integer
      media_type:
        type: string
      price:
        type: number
      purchase_at:
        type: string
      season_number:
        type: integer
      store:
        type: string
      tmdb_id:
        type: integer
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  dto.SeasonResponse:
    properties:
      air_date:
        type: string
      episode_count:
        type: integer
      id:
        type: integer
      name:
        type: string
      overview:
        type: string
      poster_path:
        type: string
      season_number:
        type: integer
    type: object
  dto.WatchedMediaRequest:
    properties:
      episode_number:
        type: integer
      media_type:
        description: '"movie", "tv", "episode"'
        type: string
      season_number:
        type: integer
      tmdb_id:
        type: integer
      watched:
        type: boolean
    type: object
  dto.WatchedMediaResponse:
    properties:
      created_at:
        type: string
      episode_number:
        type: integer
      id:
        type: integer
      media_type:
        type: string
      season_number:
        type: integer
      tmdb_id:
        type: integer
      updated_at:
        type: string
      user_id:
        type: integer
      watch_count:
        type: integer
      watched:
        type: boolean
    type: object
  tmdb.GenreItem:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Api for CineLog
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Swagger CineLog Swagger API
  version: "1.0"
paths:
  /analytics:
    get:
      consumes:
      - application/json
      description: Get user's watch statistics and analytics
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AnalyticsResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get analytics
      tags:
      - Analytics
  /auth/register:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Create user account
      tags:
      - Authentication
  /collection:
    get:
      consumes:
      - application/json
      description: Get the user's physical media collection
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.PhysicalMediaResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get physical collection
      tags:
      - Physical Collection
  /discovers:
    get:
      consumes:
      - application/json
      description: Get a list of movies based on filters
      parameters:
      - description: Genre ID
        in: query
        name: genre
        type: string
      - description: Minimum rating
        in: query
        name: minimum_rating
        type: number
      - description: Release date less than (YYYY-MM-DD)
        in: query
        name: release_date_lt
        type: string
      - description: Release date greater than (YYYY-MM-DD)
        in: query
        name: release_date_gt
        type: string
      - description: Language (e.g., en-US)
        in: query
        name: translation
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DiscoverResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Discover movies
      tags:
      - Movies
  /discovers/tv:
    get:
      consumes:
      - application/json
      description: Get a list of TV shows based on filters
      parameters:
      - description: Genre ID
        in: query
        name: genre
        type: string
      - description: Minimum rating
        in: query
        name: minimum_rating
        type: number
      - description: First air date less than (YYYY-MM-DD)
        in: query
        name: release_date_lt
        type: string
      - description: First air date greater than (YYYY-MM-DD)
        in: query
        name: release_date_gt
        type: string
      - description: Language (e.g., en-US)
        in: query
        name: translation
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DiscoverResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Discover TV shows
      tags:
      - TV Shows
  /history:
    get:
      consumes:
      - application/json
      description: Get the user's watch history
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.WatchedMediaResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get watch history
      tags:
      - Watched Media
  /media/increment-watch:
    post:
      consumes:
      - application/json
      description: Increment the watch count for a media item
      parameters:
      - description: Watched media request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.WatchedMediaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.WatchedMediaResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Increment watch count
      tags:
      - Watched Media
  /media/physical:
    post:
      consumes:
      - application/json
      description: Add a physical media item to the collection (Blu-ray, DVD, etc.)
      parameters:
      - description: Physical media request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.PhysicalMediaRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.PhysicalMediaResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add physical media
      tags:
      - Physical Collection
  /media/physical/{id}:
    delete:
      consumes:
      - application/json
      description: Remove a physical media item from the collection
      parameters:
      - description: Physical media ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete physical media
      tags:
      - Physical Collection
    get:
      consumes:
      - application/json
      description: Get details of a specific physical media item
      parameters:
      - description: Physical media ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PhysicalMediaResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get physical media by ID
      tags:
      - Physical Collection
    put:
      consumes:
      - application/json
      description: Update details of a physical media item
      parameters:
      - description: Physical media ID
        in: path
        name: id
        required: true
        type: integer
      - description: Physical media request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.PhysicalMediaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PhysicalMediaResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update physical media
      tags:
      - Physical Collection
  /media/watched:
    post:
      consumes:
      - application/json
      description: Mark a movie, TV show, or episode as watched or unwatched
      parameters:
      - description: Watched media request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.WatchedMediaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.WatchedMediaResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Mark media as watched
      tags:
      - Watched Media
  /movie/{id}:
    get:
      consumes:
      - application/json
      description: Get detailed information about a specific movie
      parameters:
      - description: Movie ID
        in: path
        name: id
        required: true
        type: integer
      - description: Language (e.g., en-US)
        in: query
        name: language
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MediaResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get movie details
      tags:
      - Movies
  /movie/{id}/cast:
    get:
      consumes:
      - application/json
      description: Get the cast and crew of a specific movie
      parameters:
      - description: Movie ID
        in: path
        name: id
        required: true
        type: integer
      - description: Language (e.g., en-US)
        in: query
        name: language
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.CastResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get movie cast
      tags:
      - Movies
  /tv/{id}:
    get:
      consumes:
      - application/json
      description: Get detailed information about a specific TV show
      parameters:
      - description: TV Show ID
        in: path
        name: id
        required: true
        type: integer
      - description: Language (e.g., en-US)
        in: query
        name: language
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MediaResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get TV show details
      tags:
      - TV Shows
  /tv/{id}/cast:
    get:
      consumes:
      - application/json
      description: Get the cast and crew of a specific TV show
      parameters:
      - description: TV Show ID
        in: path
        name: id
        required: true
        type: integer
      - description: Language (e.g., en-US)
        in: query
        name: language
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.CastResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get TV show cast
      tags:
      - TV Shows
  /tv/{id}/season/{season}:
    get:
      consumes:
      - application/json
      description: Get detailed information about a specific season of a TV show
      parameters:
      - description: TV Show ID
        in: path
        name: id
        required: true
        type: integer
      - description: Season number
        in: path
        name: season
        required: true
        type: integer
      - description: Language (e.g., en-US)
        in: query
        name: language
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get season details
      tags:
      - TV Shows
swagger: "2.0"
